name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP
        env:
          SFTP_SERVER: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            open sftp://$SFTP_USER:$SFTP_PASS@$SFTP_SERVER;
            mirror -R --only-newer \
              --exclude=.git/ \
              --exclude=.github/ \
              --exclude=.DS_Store \
              ./ /wp-content/themes/reaaltwennysix/;
            bye
          "
